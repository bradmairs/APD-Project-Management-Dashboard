server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to a 1 MB request body limit and answers anything bigger
    # with 413 before the backend ever sees it — which silently capped every
    # upload (attachments, site photos, meeting-minute transcripts) far below
    # the backend's own 20 MB multer limits in backend/src/upload.ts. 25m leaves
    # headroom for multipart overhead so an oversize file gets the backend's
    # readable error instead of a bare 413.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Chains onto any X-Forwarded-For an upstream reverse proxy (e.g. a
        # host-level nginx/Caddy in front of this container) already set,
        # rather than overwriting it — the backend's login rate limiter
        # keys on this to throttle per real client IP instead of treating
        # every request as coming from this proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
