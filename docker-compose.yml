services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apd}
      POSTGRES_DB: ${POSTGRES_DB:-apd_dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # CMP's own, physically separate database — see the README's
  # "Multi-Organization Architecture" section for why GVW and CMP don't
  # share tables (or even a server-side database) despite sharing one login.
  db-cmp:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apd}
      POSTGRES_DB: ${POSTGRES_CMP_DB:-apd_cmp}
    volumes:
      - db_cmp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-apd}:${POSTGRES_PASSWORD:-apd}@db:5432/${POSTGRES_DB:-apd_dashboard}
      CMP_DATABASE_URL: postgresql://${POSTGRES_USER:-apd}:${POSTGRES_PASSWORD:-apd}@db-cmp:5432/${POSTGRES_CMP_DB:-apd_cmp}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      FRONTEND_URL: ${FRONTEND_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ENGINEERING_ARCHIVE_BASE_URL: ${ENGINEERING_ARCHIVE_BASE_URL:-}
      ENGINEERING_ARCHIVE_PUBLIC_URL: ${ENGINEERING_ARCHIVE_PUBLIC_URL:-}
      ENGINEERING_ARCHIVE_API_KEY: ${ENGINEERING_ARCHIVE_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DIGEST_CRON: ${DIGEST_CRON:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
    depends_on:
      db:
        condition: service_healthy
      db-cmp:
        condition: service_healthy
    # Bound to loopback only: the frontend container's nginx (see
    # frontend/nginx.conf) already proxies /api/ to this service over the
    # internal Docker network, and that's meant to be the only way in from
    # outside the host. Publishing 4000 on every interface would let
    # anyone reach the raw Express API directly — no TLS, no CORS
    # restriction, none of the header/hardening this container relies on
    # nginx or an external reverse proxy for — bypassing the frontend
    # entirely. 127.0.0.1:4000 is still reachable for local
    # debugging (curl/Postman on the host itself).
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/uploads
    # Lets the backend container reach Ollama running on the Docker host via
    # host.docker.internal — resolved out of the box on Docker Desktop, but
    # needs this mapping on Linux hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  db_cmp_data:
  uploads_data:
